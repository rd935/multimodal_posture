data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 20          # max epochs
  patience: 4         # early stopping patience
  batch_size: 8
  learning_rate: 1e-4
  seed: 41

loader:
  num_workers: 0      # on Windows often safer/slower but stable; try 2-4 if you want

logging:
  ckpt_dir: checkpoints/rgb_baseline
  results_dir: results/rgb_baseline
