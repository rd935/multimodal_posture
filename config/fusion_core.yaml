data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 40
  patience: 10
  batch_size: 8
  learning_rate: 1e-4

  # For this run: NO aux losses, just like attention
  lambda_contrastive: 0.0
  lambda_uncertainty_reg: 0.0
  lambda_attn_entropy: 0.01   # same scale as attention fusion

loader:
  num_workers: 4

logging:
  ckpt_dir: checkpoints/fusion_core
  results_dir: results/fusion_core

model:
  embed_dim: 256
  fusion_hidden_dim: 512
  attn_hidden_dim: 256
  proj_dim: 128
  pretrained: true
  tau: 1.0
  freeze_backbone: false
  normalize_embeddings: true