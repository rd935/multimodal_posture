data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 60
  patience: 10
  learning_rate: 1e-4
  batch_size: 8
  seed: 42
  label_smoothing: 0.05

loader:
  num_workers: 4

logging:
  ckpt_dir: checkpoints/fusion_core
  results_dir: results/fusion_core

model:
  embed_dim: 256
  fusion_hidden_dim: 512
  attn_hidden_dim: 256
  pretrained: true
  freeze_backbone: false
  normalize_embeddings: true

loss:
  # Contrastive learning (helps representation alignment)
  contrastive_temperature: 0.1
  contrastive_weight: 0.003

  # Uncertainty regularizer (keeps variance heads stable)
  uncertainty_reg_weight: 0.00003

  # Soft attention entropy penalty (prevents collapsing attention)
  attn_entropy_weight: 0.0005

  # TRAINING-ONLY: randomly drop one modality to learn robustness
  modality_dropout_prob: 0.1
