data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 30
  patience: 7
  batch_size: 8
  learning_rate: 1e-4

  # Loss weights
  lambda_contrastive: 0.05          # smaller, auxiliary
  lambda_uncertainty_reg: 0.001     # small regularizer on logvars
  lambda_attn_entropy: 0.01

loader:
  num_workers: 4

logging:
  ckpt_dir: checkpoints/fusion_core
  results_dir: results/fusion_core

model:
  embed_dim: 256
  fusion_hidden_dim: 512
  attn_hidden_dim: 256
  proj_dim: 128
  pretrained: true
  normalize_embeddings: false
  freeze_backbone: false

