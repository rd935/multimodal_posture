data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 80
  patience: 15
  learning_rate: 7e-5
  batch_size: 8

loader:
  num_workers: 4

logging:
  ckpt_dir: checkpoints/fusion_core
  results_dir: results/fusion_core

model:
  embed_dim: 256
  fusion_hidden_dim: 512
  attn_hidden_dim: 256
  pretrained: true
  freeze_backbone: false
  normalize_embeddings: true

loss:
  contrastive_temperature: 0.07
  contrastive_weight: 0.03           # tune: e.g. 0.05–0.2
  uncertainty_reg_weight: 0.0001      # keeps log-variance bounded
  attn_entropy_weight: 0.005         # similar to your attention model, can reduce if too strong
  contrastive_warmup_epochs: 5
  uncertainty_start_epoch: 12
