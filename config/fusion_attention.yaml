data:
  train_csv: data/utd_mhad/splits/utd_mhad_train.csv
  val_csv: data/utd_mhad/splits/utd_mhad_val.csv
  test_csv: data/utd_mhad/splits/utd_mhad_test.csv
  rgb_frames: 16
  resize: [224, 224]

train:
  epochs: 30
  patience: 7
  learning_rate: 1e-4
  batch_size: 8

loader:
  num_workers: 4

model:
  embed_dim: 256
  fusion_hidden_dim: 512
  attn_hidden_dim: 256
  pretrained: true
  freeze_backbone: false
  normalize_embeddings: true

logging:
  ckpt_dir: checkpoints/fusion_attention
  results_dir: results/fusion_attention
